[project]
name = "riaw-presentaci-nfinal"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "docrieux", email = "docrieux@protonmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "en-core-web-sm",
    "gensim>=4.4.0",
    "matplotlib>=3.11.2",
    "nltk>=3.10.4",
    "numpy>=2.4.6",
    "pandas>=3.1.0",
    "pypandoc-binary>=1.17",
    "spacy>=3.8.18",
    "wordcloud>=1.9.6",
]

[project.scripts]
riaw-presentaci-nfinal = "riaw_presentaci_nfinal:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
